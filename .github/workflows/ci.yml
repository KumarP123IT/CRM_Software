name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konvo
          POSTGRES_PASSWORD: konvo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U konvo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Tests expect both `konvo` and `konvo_test` databases; `konvo_upgrade`
      # is a scratch DB for the migrate-upgrade check below.
      - name: Create test databases
        run: |
          PGPASSWORD=konvo psql -h localhost -p 5433 -U konvo -d konvo -c "CREATE DATABASE konvo_test"
          PGPASSWORD=konvo psql -h localhost -p 5433 -U konvo -d konvo -c "CREATE DATABASE konvo_upgrade"
      - name: Migrate fresh database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://konvo:konvo@localhost:5433/konvo_test
      - name: Migrate upgrade path (previous schema -> latest)
        env:
          DATABASE_URL: postgresql://konvo:konvo@localhost:5433/konvo_upgrade
        run: |
          # Simulate an existing install: apply every migration except the
          # newest by hand, mark them applied, then let `migrate deploy`
          # apply the remainder — this is the path production upgrades take.
          latest=$(ls prisma/migrations | grep -v migration_lock.toml | sort | tail -1)
          for dir in $(ls prisma/migrations | grep -v migration_lock.toml | grep -v "^${latest}$" | sort); do
            PGPASSWORD=konvo psql -h localhost -p 5433 -U konvo -d konvo_upgrade -v ON_ERROR_STOP=1 -f "prisma/migrations/$dir/migration.sql" > /dev/null
            npx prisma migrate resolve --applied "$dir"
          done
          npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
