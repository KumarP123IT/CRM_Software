# Konvo — front-door reverse proxy. Mounted at /etc/nginx/nginx.conf inside
# the nginx container (full config: events + http). Plain HTTP on :8531 in
# the container, published on the host as NGINX_HOST_PORT.
#
# Single origin: /api/*, /widget.js, /health and /ready go to the backend,
# everything else to the frontend — keeps the httpOnly auth cookies
# first-party. SSE (inbox live events) is unbuffered.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream konvo_backend {
        server backend:4000;
    }

    upstream konvo_frontend {
        server frontend:3000;
    }

    server {
        listen 8531;
        server_name _;
        client_max_body_size 25m;

        # Long requests (exports, big payloads) must not be killed.
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;

        # Backend: API, embeddable widget script, health probes.
        location ~ ^/(api(/|$)|widget\.js$|health$|ready$) {
            proxy_pass http://konvo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;   # keeps the :port — do NOT use $host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE must not be buffered.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Frontend (Nitro SSR server).
        location / {
            proxy_pass http://konvo_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
